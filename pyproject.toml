[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "turbomlx"
version = "0.2.0"
description = "TurboMLX companion package for mlx-lm with paper-faithful key-path TurboQuant primitives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TurboMLX" }]
keywords = [
  "mlx",
  "mlx-lm",
  "kv-cache",
  "quantization",
  "turboquant",
  "qwen",
  "apple-silicon",
  "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
mlx = [
  "mlx>=0.31.2,<0.32",
  "mlx-lm>=0.31.3,<0.32",
]
serialize = [
  "safetensors>=0.4.5,<1",
]

[project.urls]
Homepage = "https://github.com/alicankiraz1/Qwen3.5-TurboQuant-MLX-LM"
Repository = "https://github.com/alicankiraz1/Qwen3.5-TurboQuant-MLX-LM"
Issues = "https://github.com/alicankiraz1/Qwen3.5-TurboQuant-MLX-LM/issues"

[project.scripts]
turbomlx = "turbomlx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/turbomlx"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/.venv312",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.mypy_cache",
  "/**/__pycache__",
  "/**/.DS_Store",
  "/**/__MACOSX",
  "/references/*.pdf",
  "/htmlcov",
  "/.coverage",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
  "error::DeprecationWarning:turbomlx.*",
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/turbomlx"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "SIM",
  "TID",
  "RUF",
]
ignore = [
  "E501",
  "B008",
  "B905",
  "SIM108",
  "SIM113",
  "RUF005",
  "RUF007",
  "RUF046",
  "RUF059",
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "RUF043"]
"src/turbomlx/core_ref/codebooks.py" = ["B905", "RUF007"]
"src/turbomlx/mlx_runtime/config.py" = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["turbomlx"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = false
files = ["src/turbomlx"]
